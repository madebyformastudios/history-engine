name: Render benchmark

# Measures what each visual effect costs, on one machine, same test segments.
# Run it from the Actions tab: "Render benchmark" > "Run workflow".
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Video folder name in videos/ (e.g. mongol-empire)"
        required: true
        default: "mongol-empire"
      frames:
        description: "Frames per test segment (3 segments per variant)"
        default: "120"
      scale:
        description: "Render scale (1 = 1920x1080, 0.5 = half)"
        default: "1"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx remotion browser ensure
        env:
          VIDEO: ${{ inputs.video }}
      - run: node scripts/v.mjs bench "${{ inputs.video }}" --frames=${{ inputs.frames }} --scale=${{ inputs.scale }}
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-clips
          path: out/bench/
          retention-days: 7
